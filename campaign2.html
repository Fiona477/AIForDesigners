<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diet Coke Honeydew: Cool in the City — Fiona Mei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111;
  --muted:#6b6b6b;
  --rule:#d9d9d9;
  --accent:#444444;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --display:"Libre Caslon Display",Georgia,serif;
  --sans:Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit}

/* Sticky nav */
.sections{position:sticky;top:0;z-index:5;background:#fff;display:flex;justify-content:center;padding:12px 24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:13px;font-weight:500}
.sections a{text-decoration:none}
.sections a:hover{text-decoration:underline;text-underline-offset:4px}

/* Article header */
.head{max-width:760px;margin:56px auto 36px;padding:0 24px;text-align:center}
.rubric{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);text-decoration:none}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6.4vw,76px);line-height:1.04;margin:16px 0 18px}
.dek{font-size:clamp(18px,2.1vw,22px);line-height:1.45;color:#333;margin:0 auto;max-width:600px}
.meta{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.02em}

/* Hero (animated artwork) */
.hero-wrap{margin:0;padding:0}
.hero-label{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;text-align:center;margin:0;padding:24px 24px 20px}
#hero{position:relative;width:100%;aspect-ratio:1536/768;overflow:hidden;background:linear-gradient(90deg,#d7dccb,#d4dac6 50%,#c0cbaf)}
#stage{position:absolute;left:50%;top:50%;width:1536px;height:1024px;transform-origin:0 0}
#art{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
#art img,#art canvas{position:absolute;left:0;top:0;width:1536px;height:1024px;display:block}
.credit{display:flex;justify-content:space-between;gap:16px;font-family:var(--sans);font-size:12px;color:var(--muted);padding:10px 0 0;border-top:1px solid var(--rule);margin-top:10px}

/* Body */
article{max-width:1080px;margin:0 auto;padding:0 24px}
.body{max-width:640px;margin:56px auto;font-size:19px;line-height:1.65}
.body p{margin:0 0 1.1em}
.pull{font-family:var(--display);font-size:clamp(26px,3.2vw,36px);line-height:1.2;text-align:center;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:28px 0;margin:48px 0}

/* In this campaign */
.toc{border-top:1px solid var(--ink);padding-top:24px;margin-top:24px}
.toc-label{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;text-align:center;margin:0 0 24px}
.toc-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.toc-item{display:block;padding:22px 20px 24px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc-item .num{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.toc-item .t{font-family:var(--display);font-size:26px;line-height:1.15;margin:8px 0 6px}
.toc-item .d{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--muted)}
a.toc-item:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.toc-item.soon{color:#b3b3b3}
.toc-item.soon .num,.toc-item.soon .d{color:#b3b3b3}

/* Logo */
.logo-sec{border-top:1px solid var(--ink);padding-top:24px;margin-top:64px}
.logo-fig{margin:0 auto;max-width:620px}
.logo-fig img{width:100%;display:block}

.end{text-align:center;margin:64px 0 0;font-size:22px}
footer{margin-top:72px;border-top:1px solid var(--ink);padding:28px 24px 48px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.8}

@media(max-width:760px){
  .toc-grid{grid-template-columns:1fr}
  .body{font-size:17px}
}
</style>

<script>
const BAND_TEXT = 0.32;   // capital-letter height as a share of the ribbon's width (matches the reference)
const SPEED = 50;         // px per second along the ribbon
const FADE = [300, 130, 190, 130];   // px over which print dissolves in/out at each fold (top-left curl gets a long, soft fade)
const FADE_LEAD = [40, 0, 0, 0];     // px right at the fold where the print stays fully hidden
const STEP = 2;           // mesh slice width (px) — smaller = smoother bending
const RES = 2;            // render resolution
const RED = '#c8102e', GRN = '#2f5f22';
const UNIT = [['COOL IN THE CITY',RED],['   •   ',GRN],['HONEYDEW   •   CRISP   •   REFRESHING',GRN],['   •   ',GRN]];

const FOLDS = [[338,212],[1070,428],[462,509],[1250,827]];   // lower strand starts after its curl, where the band runs straight
const SECTIONS = [[0,1,true],[1,2,false],[2,3,true],[3,0,false]];   // front face visible?
/* [x, y, half-width of the ribbon face in px] — the print is stretched across this width */
const ANCHORS = [
  [338,212,38],[420,195,46],[600,268,48],[800,322,46],[1000,372,44],[1083,480,40],
  [1010,500,26],[520,440,26],[418,480,42],
  [440,492,44],[500,520,45],[700,595,46],[900,672,48],[1100,778,46],[1200,822,43],[1268,812,38],
  [1100,675,26],[580,390,26],[420,295,26],[340,225,38]
];

/* ---------- geometry ---------- */
const P = document.getElementById('loop');
const len = Math.floor(P.getTotalLength());
const X = new Float32Array(len+1), Y = new Float32Array(len+1), ANG = new Float32Array(len+1);
for (let i=0;i<=len;i++){ const q=P.getPointAtLength(i); X[i]=q.x; Y[i]=q.y; }
for (let i=0;i<=len;i++){ const a=Math.max(0,i-3), b=Math.min(len,i+3); ANG[i]=Math.atan2(Y[b]-Y[a], X[b]-X[a]); }
const nearest = (ax,ay,from=0) => { let best=from,bd=1e12; for(let i=from;i<=len;i++){const d=(X[i]-ax)**2+(Y[i]-ay)**2; if(d<bd){bd=d;best=i;}} return best; };
const FI = [0]; for (let f=1; f<FOLDS.length; f++) FI.push(nearest(FOLDS[f][0],FOLDS[f][1],FI[f-1]+20)); FI.push(len);
const AI = []; let last = 0;
for (const [ax,ay] of ANCHORS){ last = nearest(ax,ay,Math.max(0,last-5)); AI.push(last); }
AI[0]=0; AI[AI.length-1]=len;
const HW = new Float32Array(len+1);
for (let i=0;i<=len;i++){ let j=0; while (j<AI.length-2 && i>AI[j+1]) j++;
  const t=Math.max(0,Math.min(1,(i-AI[j])/((AI[j+1]-AI[j])||1))); HW[i]=ANCHORS[j][2]+(ANCHORS[j+1][2]-ANCHORS[j][2])*t; }
// smooth the half-width so the edges have no kinks
const HWs = HW.slice(); for (let i=0;i<=len;i++){ let s=0,n=0; for(let k=-25;k<=25;k++){const q=i+k; if(q>=0&&q<=len){s+=HW[q];n++;}} HWs[i]=s/n; }
const ALPHA = new Float32Array(len+1);
for (let i=0;i<=len;i++){
  let a = 1;
  FI.forEach((f,k) => { const fold = k % FOLDS.length;               // last entry = end of loop = top-left curl again
    const t = Math.max(0, Math.min(1, (Math.abs(i-f) - FADE_LEAD[fold]) / FADE[fold]));
    a = Math.min(a, t*t*(3-2*t)); });
  ALPHA[i] = a;
}

// mesh: one slice every STEP px on the FRONT faces only; each slice spans the ribbon edge to edge
const slices = [];
SECTIONS.forEach(([a,b,isF],s) => {
  if (!isF) return;
  const col = [];
  for (let i=FI[s]; i<=FI[s+1]; i+=STEP){
    const nx=-Math.sin(ANG[i]), ny=Math.cos(ANG[i]), h=HWs[i];
    col.push({i, tx:X[i]-nx*h, ty:Y[i]-ny*h, bx:X[i]+nx*h, by:Y[i]+ny*h});   // t = top edge, b = bottom edge
  }
  for (let k=0;k<col.length-1;k++) slices.push([col[k], col[k+1]]);
});

/* ---------- the printed strip (flat texture) ---------- */
const TH = 96*RES;                        // texture height = full ribbon width
let tex, TW = len;                        // texture length = one trip round the loop
function printStrip(){
  tex = document.createElement('canvas');
  tex.width = Math.round(TW*RES); tex.height = TH;
  const g = tex.getContext('2d');
  const cap = BAND_TEXT * TH;             // target capital height in texture px
  let fs = 100; g.font = `700 ${fs}px Montserrat, "Arial Black", Arial, sans-serif`;
  const asc = g.measureText('H').actualBoundingBoxAscent || fs*0.7;
  fs = fs * cap / asc; g.font = `700 ${fs}px Montserrat, "Arial Black", Arial, sans-serif`;
  const sp = fs*0.005;
  const chars=[]; let W=0;
  for (const [t,c] of UNIT) for (const ch of t){ const w=g.measureText(ch).width+sp; chars.push([ch,c,w]); W+=w; }
  const n = Math.max(1, Math.round(TW*RES / W)), stretch = TW*RES/(n*W);   // whole repeats: seamless loop
  g.textBaseline = 'alphabetic'; g.textAlign = 'center';
  const base = TH/2 + cap/2;
  let x = 0;
  for (let r=0;r<n;r++) for (const [ch,c,w] of chars){
    const ww=w*stretch;
    if (ch==='•'){ g.fillStyle=c; for (const dx of [0,-tex.width,tex.width]){ g.beginPath(); g.arc(x+ww/2+dx, TH/2, cap*0.13, 0, Math.PI*2); g.fill(); } }
    else if (ch!==' '){ g.fillStyle=c; g.fillText(ch, x+ww/2, base); g.fillText(ch, x+ww/2-tex.width, base); g.fillText(ch, x+ww/2+tex.width, base); }
    x+=ww;
  }
  if (gl) uploadTexture();
}

/* ---------- draw ---------- */
const cv = document.getElementById('c');
const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
cv.width = 1536*DPR; cv.height = 1024*DPR;   // match the screen: sharp on retina, light on everything else
const gl = cv.getContext('webgl2', {premultipliedAlpha:true, antialias:true});
let prog, glTex, nVerts = 0, uOff, uTW;

if (gl){
  const vs = `#version 300 es
    in vec2 p; in float L; in float v; in float a;
    uniform float off, TW;
    out vec2 uv; out float al;
    void main(){ gl_Position = vec4(p.x/768.0-1.0, 1.0-p.y/512.0, 0.0, 1.0); uv = vec2((L-off)/TW, v); al = a; }`;
  const fs = `#version 300 es
    precision highp float;
    in vec2 uv; in float al; uniform sampler2D t; out vec4 o;
    void main(){ o = texture(t, vec2(fract(uv.x), uv.y)) * al; }`;
  const sh = (type,src) => { const x=gl.createShader(type); gl.shaderSource(x,src); gl.compileShader(x); return x; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog);
  gl.useProgram(prog);
  // mesh: two vertices (top edge, bottom edge) per slice → triangles; texture v = 0 at top edge, 1 at bottom edge
  const data = [];
  for (const [A,B] of slices){
    const vA=[A.tx,A.ty,A.i,0,ALPHA[A.i]], vB=[B.tx,B.ty,B.i,0,ALPHA[B.i]];
    const wA=[A.bx,A.by,A.i,1,ALPHA[A.i]], wB=[B.bx,B.by,B.i,1,ALPHA[B.i]];
    data.push(...vA,...vB,...wA, ...vB,...wB,...wA);
  }
  nVerts = data.length/5;
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const attr = (name,size,offs) => { const l=gl.getAttribLocation(prog,name); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,size,gl.FLOAT,false,20,offs*4); };
  attr('p',2,0); attr('L',1,2); attr('v',1,3); attr('a',1,4);
  uOff = gl.getUniformLocation(prog,'off'); uTW = gl.getUniformLocation(prog,'TW');
  glTex = gl.createTexture();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.viewport(0,0,cv.width,cv.height);
}
function uploadTexture(){
  gl.bindTexture(gl.TEXTURE_2D, glTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
}

// fallback without WebGL2: map each strip slice onto its ribbon slice with 2D canvas
const ctx = gl ? null : cv.getContext('2d');
function draw2D(off){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  for (let k=0;k<slices.length;k+=2){
    const A=slices[k][0], B=slices[Math.min(k+1,slices.length-1)][1];
    const a = Math.min(ALPHA[A.i], ALPHA[B.i]); if (a < 0.01 || B.i < A.i) continue;
    let u0 = (A.i - off) % TW; if (u0 < 0) u0 += TW;
    const sx0 = u0*RES, sw = (B.i - A.i)*RES;
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.save(); ctx.beginPath();
    ctx.moveTo(A.tx,A.ty); ctx.lineTo(B.tx,B.ty); ctx.lineTo(B.bx,B.by); ctx.lineTo(A.bx,A.by); ctx.closePath(); ctx.clip();
    ctx.transform((B.tx-A.tx)/sw,(B.ty-A.ty)/sw,(A.bx-A.tx)/TH,(A.by-A.ty)/TH,A.tx,A.ty);
    ctx.globalAlpha = a;
    if (sx0 + sw + 2 <= tex.width) ctx.drawImage(tex, sx0, 0, sw+2, TH, 0, 0, sw+2, TH);
    else { const w1 = tex.width - sx0; ctx.drawImage(tex, sx0,0,w1,TH, 0,0,w1,TH); ctx.drawImage(tex, 0,0,sw+2-w1,TH, w1,0,sw+2-w1,TH); }
    ctx.restore();
  }
}

function frame(now){
  const off = (now/1000*SPEED) % TW;
  if (gl){
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uOff, off); gl.uniform1f(uTW, TW);
    gl.drawArrays(gl.TRIANGLES, 0, nVerts);
  } else draw2D(off);
  requestAnimationFrame(frame);
}

function fit(){
  const s = document.getElementById('hero').clientHeight/1024;
  document.getElementById('stage').style.transform = `scale(${s}) translate(-768px,-512px)`;
}
addEventListener('resize', fit); fit();
printStrip(); requestAnimationFrame(frame);
if (document.fonts) document.fonts.load('700 60px Montserrat').then(printStrip).catch(()=>{});
</script>
</body>
</html>
