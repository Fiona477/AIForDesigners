<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honeydew · Cool in the City — Image Prompter</title>
<style>
:root{
  --ink:#111; --muted:#6b6b6b; --line:#dcdfd2; --paper:#f4f5ef; --card:#fff;
  --red:#c8102e; --green:#2f5f22; --sage:#e2e4d4; --sage2:#c1cab7; --r:10px;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45}
header{background:linear-gradient(90deg,#e2e4d4,#d4dac6 50%,#c1cab7);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-weight:400;font-size:22px;margin:0;letter-spacing:-.01em}
header h1 b{color:var(--green);font-weight:700}
header .tag{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
header .note{margin-left:auto;font-size:12px;color:#4a5340}
main{max-width:1320px;margin:0 auto;padding:22px 24px 60px}
.grid{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:22px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px;font-weight:600}
label{display:block;font-weight:500;font-size:12.5px;margin:12px 0 5px}
label small{color:var(--muted);font-weight:400}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid #cfd3c4;border-radius:7px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid #dfe8d3;border-color:var(--green)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px}
.checks label{display:flex;gap:7px;align-items:center;margin:4px 0;font-weight:400;font-size:13px}
.checks input{width:auto;margin:0}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:7px;border:1px solid #cfd3c4;background:#fff;cursor:pointer;color:var(--ink)}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button:hover{filter:brightness(.97)}
.block{margin-bottom:16px}
.block-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.block-h h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.block-h button{padding:4px 10px;font-size:12px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.8px;line-height:1.55;background:#fafbf7;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.brief{font-size:14px;background:#eef2e6;border-radius:8px;padding:10px 14px;color:#24401b}
.tip{font-size:12.5px;color:#4a5340;background:#f6f7f1;border:1px dashed #cfd6c0;border-radius:8px;padding:9px 12px;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.var{margin-bottom:10px}
.var b{display:block;font-size:12.5px;margin-bottom:4px}
/* style guide card */
.guide{margin-top:22px}
.guide-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.guide-grid{grid-template-columns:1fr}}
.guide img{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.imgs{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.sw div{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11.5px}
.sw i{display:block;height:34px}
.sw span{display:block;padding:5px 7px;line-height:1.3}
.sw span em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.guide h4{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
.guide ul{margin:0;padding-left:18px}
.guide li{margin:3px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <div class="tag">Cool in the City</div>
    <h1><b>Honeydew</b> Image Prompter</h1>
  </div>
  <div class="note">Every prompt follows the campaign style guide and the hero image design.</div>
</header>

<main>
<div class="grid">
  <form class="panel" id="req" autocomplete="off">
    <h2>Request</h2>
    <div class="row">
      <div><label for="type">Image type</label><select id="type"></select></div>
      <div><label for="channel">Channel</label><select id="channel"></select></div>
    </div>
    <label for="subject">Subject &amp; action <small>— who or what, doing what</small></label>
    <textarea id="subject" placeholder="e.g. a young woman sipping from the can on a sunny rooftop"></textarea>
    <label for="setting">Setting <small>— optional; blank uses the campaign default</small></label>
    <input id="setting" placeholder="e.g. on a rooftop terrace overlooking the city skyline">
    <label for="mood">Mood</label><select id="mood"></select>

    <details>
      <summary>Angle &amp; composition</summary>
      <div class="row">
        <div><label for="shot">Shot size</label><select id="shot"></select></div>
        <div><label for="angle">Camera angle</label><select id="angle"></select></div>
      </div>
      <div class="row">
        <div><label for="comp">Composition</label><select id="comp"></select></div>
        <div><label for="light">Lighting</label><select id="light"></select></div>
      </div>
      <div class="row">
        <div><label for="lens">Lens</label><select id="lens"></select></div>
        <div><label for="aspect">Aspect ratio</label><select id="aspect"></select></div>
      </div>
    </details>

    <details>
      <summary>Text, color &amp; variations</summary>
      <label for="textSpace">Reserve space for text</label>
      <select id="textSpace"><option value="auto">Auto (from image type)</option><option value="yes">Yes</option><option value="no">No</option></select>
      <label for="textIn">Text inside the image <small>— best left empty; add copy later</small></label>
      <input id="textIn" list="textOpts" placeholder="e.g. COOL IN THE CITY • HONEYDEW • CRISP • REFRESHING">
      <datalist id="textOpts"><option value="COOL IN THE CITY"><option value="COOL IN THE CITY • HONEYDEW • CRISP • REFRESHING"><option value="HONEYDEW • CRISP • REFRESHING"></datalist>
      <label for="textStyle">Text style</label>
      <select id="textStyle">
        <option value="ribbon">Printed on the ribbon (bold sans caps, red + green)</option>
        <option value="headline">Headline (elegant serif, deep green)</option>
      </select>
      <label for="colorOverride">Extra color direction <small>— optional</small></label>
      <input id="colorOverride" placeholder="e.g. pale sage linen shirt, white sneakers">
      <label for="variations">Variations</label>
      <select id="variations"><option>0</option><option>1</option><option selected>2</option><option>3</option></select>
    </details>

    <div class="btns">
      <button type="button" class="primary" id="exampleBtn">Load example</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>
  </form>

  <div class="panel out" id="out"></div>
</div>

<details class="panel guide">
  <summary>Campaign style guide (built into every prompt)</summary>
  <div class="guide-grid" style="margin-top:14px">
    <div>

function opt(sel, dict, autoLabel){

  const space = req.textSpace==='auto' ? !!t.textSpace : req.textSpace==='yes';
  const zone = space ? (t.zone || 'clean negative space on the left for headline text') : '';

  const s = [];
  s.push(`${cap(GUIDE.medium)}: ${subjectLine}.`);
  if(req.elements.length) s.push(`Featuring the campaign hero design: ${req.elements.map(k=>HERO[k].text).join('; ')}.`);
  s.push(`Framing: ${SHOTS[shotK][1]}, ${ANGLES[angleK][1]}, ${COMPS[compK][1]}.`);
  s.push(`Lighting: ${light}.`);
  s.push(`Color palette: ${color}.`);
  if(people) s.push(`People: ${GUIDE.casting}, ${mood.expr}.`);
  s.push(`Style: ${[...GUIDE.look, ...GUIDE.keywords, ...t.add].join(', ')}.`);
  s.push(`Mood: ${mood.label.replace(/ \(.*\)/,'').toLowerCase()}, ${mood.color}, with an effortless "cool in the city" attitude.`);
  s.push(`Camera: ${lens}, ${t.lens==='macro'?'razor-thin focus plane':GUIDE.dof}.`);
  if(zone) s.push(`Leave ${zone}.`);
  if(wantText){
    if(req.textStyle==='ribbon') s.push(`The ribbon is printed with the words "${req.textIn}" in ${GUIDE.ribbonFont}, clearly legible and spelled exactly as written.`);
    else s.push(`The image includes the headline "${req.textIn}" set in ${GUIDE.headlineFont}, clearly legible and spelled exactly as written.`);
  }
  s.push(`Format: ${orient(ratio)==='square'?'square':orient(ratio)==='landscape'?'wide landscape':'vertical portrait'} (${W}).`);
  if(!wantText) s.push(hasCan ? 'No other text, logos or watermarks besides the can label.' : 'No text, logos or watermarks.');
  const prompt = clean(s.join(' '));

  const neg = [...(wantText||hasCan ? ['extra text','misspelled text','distorted logo','watermark'] : ['text','words','letters','logo','watermark']),
    'distorted hands','extra fingers','deformed can','blurry','low resolution','oversaturated','stock photo cliché','plastic skin','uncanny', ...GUIDE.never];
  return {prompt, negative:neg.join(', '), meta:{t,shotK,angleK,mood,ratio}};
}

/* ===================== RENDER ===================== */
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function block(title, content, copyText){
  const b=el('div','block'), h=el('div','block-h'); h.appendChild(el('h3',null,title));
  if(copyText){ const btn=el('button',null,'Copy'); btn.type='button'; btn.onclick=()=>copy(copyText,btn); h.appendChild(btn); }
  b.appendChild(h); b.appendChild(content); return b;
}
function render(){
  const req = readReq(), out = $('#out'); out.innerHTML='';
  out.appendChild(el('h2',null,'Output'));
  if(!req.subject){ out.appendChild(el('div','empty','Describe a subject on the left, or press Load example, and an on-brand prompt appears here.')); return; }
  const res = build(req), m = res.meta;
  const brief = `${m.t.label} for ${CHANNELS[req.channel][0]} (${ratioLabel(m.ratio)}): ${req.subject}${req.setting?' '+req.setting:''}. Mood: ${m.mood.label.replace(/ \(.*\)/,'').toLowerCase()}.`;
  out.appendChild(block('Image brief', el('div','brief',brief)));
  out.appendChild(el('div','tip','Tip: for the closest match, also attach your hero image as the image or style reference in your generator (e.g. --sref in Midjourney, Style Reference in Firefly, or upload it to ChatGPT).'));
  out.appendChild(block('Prompt', el('pre',null,res.prompt), res.prompt));
  out.appendChild(block('Negative prompt (for generators that have a separate field)', el('pre',null,res.negative), res.negative));

  const varText=[];
  if(req.variations>0){
    const alts=[['cu','eye'],['wide','low'],['medium','high'],['mcu','dutch'],['ecu','eye'],['full','low'],['wide','overhead']]
      .filter(([s,a])=>s!==m.shotK).slice(0,req.variations);
    const wrap=el('div');
    alts.forEach(([s,a],i)=>{
      const v = build(req,{shot:s,angle:a});
      const d=el('div','var'), label=`${i+1}. ${SHOTS[s][0]} · ${ANGLES[a][0].split(' —')[0]}`;
      d.appendChild(el('b',null,label)); d.appendChild(el('pre',null,v.prompt));
      const btn=el('button',null,'Copy'); btn.type='button'; btn.style.cssText='margin-top:6px;font-size:12px;padding:4px 10px'; btn.onclick=()=>copy(v.prompt,btn); d.appendChild(btn);
      wrap.appendChild(d); varText.push(`${label}\n${v.prompt}`);
    });
    out.appendChild(block('Variations', wrap));
  }
  const all = [`IMAGE BRIEF: ${brief}`, `PROMPT:\n${res.prompt}`, `NEGATIVE PROMPT:\n${res.negative}`, varText.length?`VARIATIONS:\n${varText.join('\n\n')}`:null].filter(Boolean).join('\n\n');
  const btns=el('div','btns'); const b=el('button','primary','Copy everything'); b.type='button'; b.onclick=()=>copy(all,b); btns.appendChild(b); out.appendChild(btns);
}

/* ===================== COPY ===================== */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }
async function copy(text, btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e2){}
  }
  toast(ok?'Copied':'Copy blocked: select the text and copy it manually');
  if(btn&&ok){ const o=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=o,1200); }
}

/* ===================== STYLE GUIDE CARD ===================== */
function renderGuide(){
  const sw=$('#swatches');
  GUIDE.palette.forEach(([n,hex,,use])=>{ const d=el('div'); const i=el('i'); i.style.background=hex; d.appendChild(i); const sp=el('span'); sp.appendChild(el('b',null,n)); sp.appendChild(document.createElement('br')); sp.appendChild(el('em',null,hex)); sp.appendChild(document.createElement('br')); sp.appendChild(document.createTextNode(use)); d.appendChild(sp); sw.appendChild(d); });
  const g=$('#guideText');
  const sec=(h,items)=>{ g.appendChild(el('h4',null,h)); const ul=el('ul'); items.forEach(x=>ul.appendChild(el('li',null,x))); g.appendChild(ul); };
  sec('Hero design (added automatically to fit each image type)', Object.values(HERO).map(h=>cap(h.text)));
  sec('Look', [cap(GUIDE.medium), cap(GUIDE.lighting), ...GUIDE.look.map(cap), cap(GUIDE.background)]);
  sec('Typography', ['Ribbon: '+GUIDE.ribbonFont, 'Headlines: '+GUIDE.headlineFont, 'Ribbon line: COOL IN THE CITY • HONEYDEW • CRISP • REFRESHING']);
  sec('People', [cap(GUIDE.casting), cap(GUIDE.wardrobe)]);
  sec('Never', [GUIDE.never.join(', ')]);
}

/* ===================== INIT ===================== */
opt('#type', TYPES);
opt('#channel', Object.fromEntries(Object.entries(CHANNELS).map(([k,v])=>[k,`${v[0]} (${ratioLabel(v[1])})`])));
opt('#mood', MOODS);
opt('#shot', SHOTS, 'Auto (from image type)');
opt('#angle', ANGLES, 'Auto (from image type)');
opt('#comp', COMPS, 'Auto (from image type)');
opt('#light', LIGHTS);
opt('#lens', LENSES, 'Auto (from image type)');
opt('#aspect', Object.fromEntries(RATIOS.map(r=>[r,ratioLabel(r)])), 'Auto (from channel)');
function applyType(){
  const t=TYPES[$('#type').value];
  if(!channelTouched) $('#channel').value=t.channel;
}
let channelTouched=false;
$('#channel').addEventListener('change',()=>channelTouched=true);
$('#type').addEventListener('change',applyType);
$('#req').addEventListener('input', render);
$('#req').addEventListener('change', render);
$('#req').addEventListener('submit', e=>e.preventDefault());
function setType(v){ $('#type').value=v; applyType(); }
$('#exampleBtn').onclick=()=>{
  $('#subject').value='a young woman laughing as she lifts an ice-cold can, a friend beside her';
  $('#setting').value='on a sunlit rooftop terrace overlooking the city skyline';
  channelTouched=false; setType('lifestyle'); $('#mood').value='cool';
  ['#shot','#angle','#comp','#lens','#aspect'].forEach(s=>$(s).value=''); $('#light').value='campaign';
  render();
};
$('#resetBtn').onclick=()=>{ $('#req').reset(); channelTouched=false; setType('hero'); render(); };
setType('hero'); renderGuide(); render();
</script>
