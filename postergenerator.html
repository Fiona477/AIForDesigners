<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimental Typographic Poster Generator</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --panel-border: #333333;
      --accent: #d62828;
      --accent-hover: #e63946;
      --text-main: #f4f4f1;
      --text-muted: #a0a0a0;
      --input-bg: #2a2a2a;
      --canvas-aspect: 1.414; /* 100:141 Ratio */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* APP LAYOUT */
    #app { display: flex; width: 100vw; height: 100vh; }
    
    /* LEFT PANEL: EDITOR */
    .editor-panel {
      width: 420px;
      min-width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    }

    .editor-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

    .editor-tabs {
      display: flex;
      background: #181818;
      border-bottom: 1px solid var(--panel-border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active { color: var(--text-main); border-bottom-color: var(--accent); background: var(--panel-bg); }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }
    .tab-content.active { display: block; }

    /* FORM CONTROLS */
    .control-group { margin-bottom: 20px; }
    .control-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; }
    
    .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .input-row .flex-1 { flex: 1; }

    input[type="text"], select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    input[type="color"] {
      -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--panel-border); border-radius: 4px; }

    .btn {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: #333; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-group { display: flex; gap: 4px; }
    .btn-group .btn { flex: 1; padding: 6px; }
    .btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* PALETTE SWATCHES */
    .palette-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .swatch {
      width: 28px; height: 28px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; position: relative;
    }
    .swatch.selected::after {
      content: ''; position: absolute; inset: -3px; border: 2px solid var(--accent); border-radius: 6px;
    }

    /* RIGHT PANEL: CANVAS PREVIEW */
    .preview-panel {
      flex: 1;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .action-group { display: flex; gap: 8px; }

    #canvas-container {
      position: relative;
      background-color: #F4F4F1;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    /* CANVAS ELEMENTS */
    .poster-element {
      position: absolute;
      transform-origin: center center;
      cursor: move;
      box-sizing: border-box;
    }
    .poster-element.selected {
      outline: 1.5px dashed var(--accent);
    }
    .poster-text {
      white-space: pre;
      line-height: 0.9;
      user-select: none;
    }

    /* GRID OVERLAY */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      padding: 6%;
      gap: 1.5%;
      opacity: 0.2;
      z-index: 99;
    }
    .grid-col { background: rgba(0,100,255,0.15); border: 1px dashed rgba(0,100,255,0.4); height: 100%; }

    /* LAYER LIST */
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .layer-item.selected { border-color: var(--accent); background: #333; }
  </style>
</head>
<body>

<div id="app">
  <!-- LEFT PANEL: CONTROLS & EDITOR -->
  <div class="editor-panel">
    <div class="editor-header">
      <h1>Poster Lab</h1>
      <span style="font-size:10px; color:var(--text-muted);">Swiss / Bauhaus Engine</span>
    </div>

    <div class="editor-tabs">
      <button class="tab-btn active" onclick="switchTab('templates')">Presets</button>
      <button class="tab-btn" onclick="switchTab('text')">Type</button>
      <button class="tab-btn" onclick="switchTab('shapes')">Shapes</button>
      <button class="tab-btn" onclick="switchTab('colors')">Palette</button>
      <button class="tab-btn" onclick="switchTab('layers')">Layers</button>
    </div>

    <!-- TEMPLATES TAB -->
    <div id="tab-templates" class="tab-content active">
      <div class="control-group">
        <label>Geometric Style Presets</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button class="btn" onclick="loadTemplate('swiss_modernist')">Swiss Modernist</button>
          <button class="btn" onclick="loadTemplate('bauhaus')">Bauhaus Structural</button>
          <button class="btn" onclick="loadTemplate('constructivist')">Constructivist</button>
          <button class="btn" onclick="loadTemplate('minimal_geometric')">Minimal Geometric</button>
          <button class="btn" onclick="loadTemplate('editorial')">Editorial Grid</button>
          <button class="btn" onclick="loadTemplate('experimental')">Experimental Deconstructed</button>
        </div>
      </div>
      <div class="control-group" style="margin-top: 20px;">
        <label>Grid System Settings</label>
        <button class="btn" style="width:100%;" onclick="toggleGrid()">Toggle 12-Column Grid Overlay</button>
      </div>
    </div>

    <!-- TYPOGRAPHY TAB -->
    <div id="tab-text" class="tab-content">
      <div class="control-group">
        <button class="btn btn-primary" style="width:100%; margin-bottom:12px;" onclick="addText()">+ Add Text Block</button>
      </div>
      <div id="text-controls" style="display:none;">
        <div class="control-group">
          <label>Text Content</label>
          <textarea id="text-val" rows="3" oninput="updateSelectedText('text', this.value)"></textarea>
        </div>
        <div class="control-group">
          <label>Font Family</label>
          <select id="text-font" onchange="updateSelectedText('fontFamily', this.value)">
            <option value="Helvetica, Arial, sans-serif">Helvetica / Neo-Grotesque</option>
            <option value="Courier New, monospace">Courier / Monospace</option>
            <option value="Times New Roman, serif">Times / Serif</option>
          </select>
        </div>
        <div class="control-group">
          <label>Custom Font (.ttf, .otf, .woff)</label>
          <input type="file" accept=".ttf,.otf,.woff,.woff2" onchange="uploadFont(event)" style="font-size: 11px;">
        </div>
        <div class="control-group">
          <label>Font Size (Scale Unit 8–276px)</label>
          <div class="input-row">
            <input type="range" id="text-size" min="8" max="276" oninput="updateSelectedText('fontSize', this.value + 'px')">
            <input type="text" id="text-size-val" style="width:50px;" readonly>
          </div>
        </div>
        <div class="control-group">
          <label>Style & Weight</label>
          <div class="btn-group">
            <button class="btn" id="btn-bold" onclick="toggleStyle('fontWeight', 'bold', 'normal')"><b>B</b></button>
            <button class="btn" id="btn-italic" onclick="toggleStyle('fontStyle', 'italic', 'normal')"><i>I</i></button>
            <button class="btn" id="btn-underline" onclick="toggleStyle('textDecoration', 'underline', 'none')"><u>U</u></button>
          </div>
        </div>
        <div class="control-group">
          <label>Text Color</label>
          <input type="color" id="text-color" onchange="updateSelectedText('color', this.value)">
        </div>
      </div>
    </div>

    <!-- SHAPES TAB -->
    <div id="tab-shapes" class="tab-content">
      <div class="control-group">
        <label>Add Graphic Element</label>
        <div class="btn-group">
          <button class="btn" onclick="addShape('rectangle')">Bar / Rect</button>
          <button class="btn" onclick="addShape('circle')">Circle</button>
          <button class="btn" onclick="addShape('semicircle')">Semi-Circle</button>
          <button class="btn" onclick="addShape('line')">Line</button>
        </div>
      </div>
      <div id="shape-controls" style="display:none;">
        <div class="control-group">
          <label>Fill Color</label>
          <input type="color" id="shape-fill" onchange="updateSelectedShape('fill', this.value)">
        </div>
        <div class="control-group">
          <label>Stroke Color & Weight</label>
          <div class="input-row">
            <input type="color" id="shape-stroke" onchange="updateSelectedShape('stroke', this.value)">
            <input type="range" id="shape-stroke-width" min="0" max="30" value="0" oninput="updateSelectedShape('strokeWidth', this.value + 'px')">
          </div>
        </div>
        <div class="control-group">
          <label>Rotation</label>
          <div class="input-row">
            <input type="range" id="shape-rotation" min="0" max="360" value="0" oninput="updateSelectedShape('rotation', this.value)">
            <span id="rotation-val" style="font-size:12px; width:35px;">0°</span>
          </div>
        </div>
        <div class="control-group">
          <label>Opacity</label>
          <input type="range" id="shape-opacity" min="0" max="1" step="0.05" value="1" oninput="updateSelectedShape('opacity', this.value)">
        </div>
      </div>
    </div>

    <!-- COLOR PALETTE TAB -->
    <div id="tab-colors" class="tab-content">
      <div class="control-group">
        <label>Poster Background Color</label>
        <input type="color" id="bg-color-picker" value="#F4F4F1" onchange="setCanvasBackground(this.value)" style="width:100%;">
      </div>
      <div class="control-group">
        <label>Active Palette Swatches</label>
        <div class="palette-list" id="palette-swatches"></div>
        <div class="input-row">
          <input type="color" id="new-color-val" value="#D62828">
          <button class="btn" onclick="addPaletteColor()">Add to Palette</button>
        </div>
      </div>
    </div>

    <!-- LAYERS TAB -->
    <div id="tab-layers" class="tab-content">
      <div class="control-group">
        <label>Layer Ordering</label>
        <div class="btn-group" style="margin-bottom:12px;">
          <button class="btn" onclick="moveLayer('up')">Bring Forward</button>
          <button class="btn" onclick="moveLayer('down')">Send Backward</button>
        </div>
        <button class="btn" style="width:100%; background:#421515; border-color:#600;" onclick="deleteSelected()">Delete Selected Element</button>
      </div>
      <div class="control-group">
        <label>Canvas Layers</label>
        <div id="layer-list"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL: PREVIEW & CANVAS -->
  <div class="preview-panel">
    <div class="top-bar">
      <div class="action-group">
        <button class="btn" onclick="undo()">Undo</button>
        <button class="btn" onclick="redo()">Redo</button>
      </div>
      <div class="action-group">
        <button class="btn" onclick="exportPoster('png')">PNG</button>
        <button class="btn" onclick="exportPoster('jpg')">JPG</button>
        <button class="btn btn-primary" onclick="exportPoster('svg')">Export SVG</button>
      </div>
    </div>

    <!-- MAIN POSTER CANVAS -->
    <div id="canvas-container">
      <div id="grid-overlay" class="grid-overlay" style="display:none;">
        <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
        <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
        <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
      </div>
      <div id="canvas-elements"></div>
    </div>
  </div>
</div>

<script>
  // STATE MANAGEMENT
  let state = {
    bgColor: '#F4F4F1',
    elements: [],
    selectedId: null,
    palette: ['#000000', '#F4F4F1', '#D62828', '#1D4ED8', '#EA580C']
  };

  const history = [];
  let historyStep = -1;

  const canvas = document.getElementById('canvas-container');
  const elementsContainer = document.getElementById('canvas-elements');

  // CANVAS RESIZING
  function resizeCanvas() {
    const parent = canvas.parentElement;
    const padding = 60;
    const availWidth = parent.clientWidth - padding;
    const availHeight = parent.clientHeight - padding;
    
    let height = availHeight;
    let width = height / 1.414;

    if (width > availWidth) {
      width = availWidth;
      height = width * 1.414;
    }

    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
  }
  window.addEventListener('resize', resizeCanvas);

  function pushHistory() {
    historyStep++;
    history.splice(historyStep);
    history.push(JSON.stringify(state));
  }

  function undo() {
    if (historyStep > 0) {
      historyStep--;
      state = JSON.parse(history[historyStep]);
      render();
    }
  }

  function redo() {
    if (historyStep < history.length - 1) {
      historyStep++;
      state = JSON.parse(history[historyStep]);
      render();
    }
  }

  // ELEMENT MANAGEMENT
  function generateId() { return 'el_' + Math.random().toString(36).substr(2, 9); }

  function addText(defaults = {}) {
    const el = {
      id: generateId(),
      type: 'text',
      text: defaults.text || 'prague\nschool\nof\ndesign',
      x: defaults.x || 10,
      y: defaults.y || 10,
      fontSize: defaults.fontSize || 37,
      fontFamily: defaults.fontFamily || 'Helvetica, Arial, sans-serif',
      fontWeight: defaults.fontWeight || 'bold',
      fontStyle: 'normal',
      textDecoration: 'none',
      color: defaults.color || '#000000',
      rotation: defaults.rotation || 0,
      opacity: 1
    };
    state.elements.push(el);
    state.selectedId = el.id;
    pushHistory();
    render();
  }

  function addShape(shapeType, defaults = {}) {
    const el = {
      id: generateId(),
      type: 'shape',
      shapeType: shapeType,
      x: defaults.x || 20,
      y: defaults.y || 20,
      width: defaults.width || 30,
      height: defaults.height || 30,
      fill: defaults.fill || '#000000',
      stroke: defaults.stroke || 'transparent',
      strokeWidth: defaults.strokeWidth || 0,
      rotation: defaults.rotation || 0,
      opacity: defaults.opacity || 1
    };
    state.elements.push(el);
    state.selectedId = el.id;
    pushHistory();
    render();
  }

  function selectElement(id) {
    state.selectedId = id;
    render();
  }

  // RENDER ENGINE
  function render() {
    canvas.style.backgroundColor = state.bgColor;
    document.getElementById('bg-color-picker').value = state.bgColor;
    elementsContainer.innerHTML = '';

    state.elements.forEach(el => {
      const node = document.createElement('div');
      node.className = `poster-element ${el.id === state.selectedId ? 'selected' : ''}`;
      node.style.left = `${el.x}%`;
      node.style.top = `${el.y}%`;
      node.style.transform = `rotate(${el.rotation || 0}deg)`;
      node.style.opacity = el.opacity;

      if (el.type === 'text') {
        node.className += ' poster-text';
        node.innerText = el.text;
        node.style.fontSize = `${(el.fontSize / 800) * canvas.clientWidth}px`;
        node.style.fontFamily = el.fontFamily;
        node.style.fontWeight = el.fontWeight;
        node.style.fontStyle = el.fontStyle;
        node.style.textDecoration = el.textDecoration;
        node.style.color = el.color;
      } else if (el.type === 'shape') {
        node.style.width = `${el.width}%`;
        node.style.height = `${el.height}%`;

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");

        if (el.shapeType === 'rectangle') {
          const rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("width", "100%");
          rect.setAttribute("height", "100%");
          rect.setAttribute("fill", el.fill);
          rect.setAttribute("stroke", el.stroke);
          rect.setAttribute("stroke-width", el.strokeWidth);
          svg.appendChild(rect);
        } else if (el.shapeType === 'circle') {
          const circle = document.createElementNS(svgNS, "ellipse");
          circle.setAttribute("cx", "50%");
          circle.setAttribute("cy", "50%");
          circle.setAttribute("rx", "48%");
          circle.setAttribute("ry", "48%");
          circle.setAttribute("fill", el.fill);
          circle.setAttribute("stroke", el.stroke);
          circle.setAttribute("stroke-width", el.strokeWidth);
          svg.appendChild(circle);
        } else if (el.shapeType === 'semicircle') {
          const path = document.createElementNS(svgNS, "path");
          path.setAttribute("d", "M 0,100 A 100,100 0 0,1 200,100 Z");
          path.setAttribute("viewBox", "0 0 200 100");
          svg.setAttribute("viewBox", "0 0 200 100");
          path.setAttribute("fill", el.fill);
          path.setAttribute("stroke", el.stroke);
          path.setAttribute("stroke-width", el.strokeWidth);
          svg.appendChild(path);
        } else if (el.shapeType === 'line') {
          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", "0");
          line.setAttribute("y1", "50%");
          line.setAttribute("x2", "100%");
          line.setAttribute("y2", "50%");
          line.setAttribute("stroke", el.fill !== 'transparent' ? el.fill : el.stroke);
          line.setAttribute("stroke-width", el.strokeWidth || 4);
          svg.appendChild(line);
        }
        node.appendChild(svg);
      }

      // DRAG & DROP INTERACTION
      node.addEventListener('mousedown', e => {
        e.stopPropagation();
        selectElement(el.id);
        let startX = e.clientX;
        let startY = e.clientY;

        function onMouseMove(me) {
          const dx = ((me.clientX - startX) / canvas.clientWidth) * 100;
          const dy = ((me.clientY - startY) / canvas.clientHeight) * 100;
          el.x += dx;
          el.y += dy;
          startX = me.clientX;
          startY = me.clientY;
          render();
        }

        function onMouseUp() {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          pushHistory();
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      elementsContainer.appendChild(node);
    });

    updateControlPanels();
    renderPalette();
    renderLayers();
  }

  // CONTROL PANEL UPDATES
  function updateControlPanels() {
    const sel = state.elements.find(e => e.id === state.selectedId);
    const textCtrl = document.getElementById('text-controls');
    const shapeCtrl = document.getElementById('shape-controls');

    if (!sel) {
      textCtrl.style.display = 'none';
      shapeCtrl.style.display = 'none';
      return;
    }

    if (sel.type === 'text') {
      textCtrl.style.display = 'block';
      shapeCtrl.style.display = 'none';
      document.getElementById('text-val').value = sel.text;
      document.getElementById('text-size').value = sel.fontSize;
      document.getElementById('text-size-val').value = sel.fontSize + 'px';
      document.getElementById('text-color').value = sel.color;
    } else if (sel.type === 'shape') {
      textCtrl.style.display = 'none';
      shapeCtrl.style.display = 'block';
      document.getElementById('shape-fill').value = sel.fill;
      document.getElementById('shape-stroke').value = sel.stroke;
      document.getElementById('shape-rotation').value = sel.rotation || 0;
      document.getElementById('rotation-val').innerText = (sel.rotation || 0) + '°';
      document.getElementById('shape-opacity').value = sel.opacity;
    }
  }

  function updateSelectedText(prop, val) {
    const sel = state.elements.find(e => e.id === state.selectedId);
    if (sel && sel.type === 'text') {
      if (prop === 'fontSize') val = parseInt(val);
      sel[prop] = val;
      render();
    }
  }

  function updateSelectedShape(prop, val) {
    const sel = state.elements.find(e => e.id === state.selectedId);
    if (sel && sel.type === 'shape') {
      sel[prop] = val;
      render();
    }
  }

  function toggleStyle(prop, val1, val2) {
    const sel = state.elements.find(e => e.id === state.selectedId);
    if (sel && sel.type === 'text') {
      sel[prop] = sel[prop] === val1 ? val2 : val1;
      render();
    }
  }

  // FONT UPLOADER
  function uploadFont(evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const fontName = file.name.split('.')[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      const newFont = new FontFace(fontName, e.target.result);
      newFont.load().then(loadedFont => {
        document.fonts.add(loadedFont);
        const select = document.getElementById('text-font');
        const opt = document.createElement('option');
        opt.value = fontName;
        opt.innerText = fontName + ' (Custom)';
        select.appendChild(opt);
        select.value = fontName;
        updateSelectedText('fontFamily', fontName);
      });
    };
    reader.readAsArrayBuffer(file);
  }

  // PALETTE SYSTEM
  function setCanvasBackground(color) {
    state.bgColor = color;
    pushHistory();
    render();
  }

  function renderPalette() {
    const container = document.getElementById('palette-swatches');
    container.innerHTML = '';
    state.palette.forEach(color => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.backgroundColor = color;
      sw.onclick = () => {
        const sel = state.elements.find(e => e.id === state.selectedId);
        if (sel) {
          if (sel.type === 'text') sel.color = color;
          if (sel.type === 'shape') sel.fill = color;
          pushHistory();
          render();
        }
      };
      container.appendChild(sw);
    });
  }

  function addPaletteColor() {
    const col = document.getElementById('new-color-val').value;
    if (!state.palette.includes(col)) {
      state.palette.push(col);
      renderPalette();
    }
  }

  // LAYERS
  function renderLayers() {
    const list = document.getElementById('layer-list');
    list.innerHTML = '';
    [...state.elements].reverse().forEach(el => {
      const item = document.createElement('div');
      item.className = `layer-item ${el.id === state.selectedId ? 'selected' : ''}`;
      item.innerText = el.type === 'text' ? `Text: ${el.text.substring(0, 12)}...` : `Shape: ${el.shapeType}`;
      item.onclick = () => selectElement(el.id);
      list.appendChild(item);
    });
  }

  function moveLayer(dir) {
    const idx = state.elements.findIndex(e => e.id === state.selectedId);
    if (idx < 0) return;
    if (dir === 'up' && idx < state.elements.length - 1) {
      const el = state.elements.splice(idx, 1)[0];
      state.elements.splice(idx + 1, 0, el);
    } else if (dir === 'down' && idx > 0) {
      const el = state.elements.splice(idx, 1)[0];
      state.elements.splice(idx - 1, 0, el);
    }
    pushHistory();
    render();
  }

  function deleteSelected() {
    state.elements = state.elements.filter(e => e.id !== state.selectedId);
    state.selectedId = null;
    pushHistory();
    render();
  }

  function toggleGrid() {
    const grid = document.getElementById('grid-overlay');
    grid.style.display = grid.style.display === 'none' ? 'grid' : 'none';
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.addClass ? document.getElementById(`tab-${tabName}`).classList.addClass('active') : document.getElementById(`tab-${tabName}`).className += ' active';
  }

  // PRESET GEOMETRIC TEMPLATES
  function loadTemplate(name) {
    state.elements = [];
    if (name === 'swiss_modernist') {
      state.bgColor = '#F4F4F1';
      // Modular Semicircles, Vertical Bars & Deconstructed Type (Matching Image Style)
      addShape('rectangle', { x: 4, y: 3, width: 4, height: 92, fill: '#000000' });
      addShape('rectangle', { x: 92, y: 3, width: 4, height: 92, fill: '#000000' });
      addShape('semicircle', { x: 15, y: 4, width: 32, height: 16, fill: '#000000', rotation: 180 });
      addShape('semicircle', { x: 22, y: 22, width: 28, height: 14, fill: '#000000', rotation: 0 });
      addShape('circle', { x: 45, y: 38, width: 26, height: 18, fill: 'transparent', stroke: '#000000', strokeWidth: 12 });
      addText({ text: '19—25.06.15', x: 12, y: 41, fontSize: 49 });
      addText({ text: 'prague\nschool\nof\ndesign', x: 72, y: 80, fontSize: 87 });
      addShape('semicircle', { x: 12, y: 70, width: 28, height: 14, fill: '#000000', rotation: 0 });
      addShape('semicircle', { x: 12, y: 80, width: 28, height: 14, fill: '#000000', rotation: 0 });
    } else if (name === 'bauhaus') {
      state.bgColor = '#EAE6DF';
      addShape('circle', { x: 20, y: 15, width: 40, height: 28, fill: '#D62828' });
      addShape('rectangle', { x: 15, y: 50, width: 65, height: 8, fill: '#000000' });
      addText({ text: 'BAUHAUS\n1919-1928', x: 18, y: 62, fontSize: 116, color: '#000000' });
      addShape('line', { x: 15, y: 80, width: 70, strokeWidth: 8, fill: '#1D4ED8' });
    } else if (name === 'constructivist') {
      state.bgColor = '#111111';
      addShape('rectangle', { x: 10, y: 10, width: 80, height: 80, fill: '#D62828', rotation: 15 });
      addText({ text: 'BEAT THE WHITES\nWITH THE RED WEDGE', x: 15, y: 40, fontSize: 87, color: '#F4F4F1' });
    } else if (name === 'minimal_geometric') {
      state.bgColor = '#FFFFFF';
      addShape('circle', { x: 35, y: 30, width: 30, height: 21, fill: '#EA580C' });
      addText({ text: 'LESS IS MORE', x: 35, y: 65, fontSize: 37, color: '#000000' });
    } else if (name === 'editorial') {
      state.bgColor = '#F0F0F0';
      addText({ text: 'ARCHITECTURAL\nSYSTEMS', x: 8, y: 10, fontSize: 155, color: '#000000' });
      addShape('line', { x: 8, y: 32, width: 84, strokeWidth: 2, fill: '#000000' });
    } else if (name === 'experimental') {
      state.bgColor = '#0A0A0A';
      addShape('semicircle', { x: 5, y: 5, width: 60, height: 30, fill: '#F4F4F1', rotation: 45 });
      addText({ text: 'DECONSTRUCT', x: 10, y: 50, fontSize: 207, color: '#D62828' });
    }
    pushHistory();
    render();
  }

  // EXPORT SYSTEM
  function exportPoster(format) {
    const node = document.getElementById('canvas-container');
    if (format === 'svg') {
      let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1131" viewBox="0 0 100 141" style="background:${state.bgColor}">`;
      state.elements.forEach(el => {
        if (el.type === 'shape') {
          if (el.shapeType === 'rectangle') {
            svgContent += `<rect x="${el.x}" y="${el.y}" width="${el.width}" height="${el.height}" fill="${el.fill}" transform="rotate(${el.rotation || 0} ${el.x} ${el.y})"/>`;
          } else if (el.shapeType === 'circle') {
            svgContent += `<ellipse cx="${el.x + el.width/2}" cy="${el.y + el.height/2}" rx="${el.width/2}" ry="${el.height/2}" fill="${el.fill}"/>`;
          }
        } else if (el.type === 'text') {
          svgContent += `<text x="${el.x}" y="${el.y + 5}" font-size="${el.fontSize/15}" font-family="${el.fontFamily}" fill="${el.color}">${el.text}</text>`;
        }
      });
      svgContent += `</svg>`;
      const blob = new Blob([svgContent], {type: 'image/svg+xml'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'poster.svg';
      a.click();
    } else {
      alert(`Exporting as ${format.toUpperCase()}... (For production PNG/JPG, render SVG to HTML5 Canvas blob)`);
    }
  }

  // INIT
  resizeCanvas();
  loadTemplate('swiss_modernist');
</script>
