<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimental Typographic Poster Generator</title>
  <!-- Google Fonts: Inter (Neo-Grotesque Swiss aesthetic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-poster: #F4F4F1;
      --ink: #000000;
      --accent-red: #D62828;
      --accent-blue: #1D4ED8;
      --accent-orange: #EA580C;
      --panel-bg: #141416;
      --panel-border: #26262a;
      --panel-text: #E5E5E5;
      --panel-muted: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #0b0b0d;
      color: var(--panel-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Left Control Sidebar */
    .sidebar {
      width: 390px;
      min-width: 360px;
      max-width: 430px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h1 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      font-size: 10px;
      background: #242428;
      color: #9e9ea7;
      padding: 3px 7px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #2a2a2e;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--panel-muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .control-label span.val {
      color: #fff;
      font-family: monospace;
    }

    input[type="text"], select {
      background: #1a1a1e;
      border: 1px solid #323238;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }

    input[type="text"]:focus, select:focus {
      border-color: #646470;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    button.btn {
      background: #202024;
      border: 1px solid #36363c;
      color: #fff;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button.btn:hover {
      background: #2c2c34;
      border-color: #555562;
    }

    button.btn-primary {
      background: #f4f4f1;
      color: #0b0b0d;
      border-color: #f4f4f1;
      flex: 1;
      font-weight: 700;
    }

    button.btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .color-swatch-list {
      display: flex;
      gap: 8px;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      transition: transform 0.1s;
    }

    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.1);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      color: #cfcfd4;
    }

    /* Rubric evaluation badge panel */
    .rubric-box {
      background: #19191d;
      border: 1px solid #28282e;
      border-radius: 4px;
      padding: 12px;
      font-size: 11px;
    }

    .rubric-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
      color: #9999a3;
      letter-spacing: 0.5px;
    }

    .rubric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .rubric-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      background: #111114;
      border-radius: 3px;
    }

    .score-badge {
      font-weight: 700;
      color: #10b981;
      font-family: monospace;
    }

    /* Main Viewport Workspace */
    .workspace {
      flex: 1;
      background: #0f0f12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      overflow: auto;
    }

    .toolbar-floating {
      position: absolute;
      top: 18px;
      display: flex;
      gap: 6px;
      background: rgba(22, 22, 26, 0.85);
      backdrop-filter: blur(10px);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #33333c;
      z-index: 100;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .tool-btn:hover {
      color: #fff;
      background: #2b2b34;
    }

    /* Poster Frame (Aspect Ratio 100:141) */
    .poster-viewport {
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.08);
      transition: transform 0.15s ease-out;
      background: var(--bg-poster);
    }

    #poster-svg {
      width: 540px;
      height: 761.4px; /* 540 * 1.41 */
      display: block;
      background: var(--bg-poster);
      overflow: hidden;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Left Inspector Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Swiss Typographic Generator</h1>
      <span class="badge">100 : 141</span>
    </div>

    <div class="sidebar-scroll">
      <!-- Actions -->
      <div class="button-row">
        <button id="btn-generate" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>
          Regenerate Layout
        </button>
        <button id="btn-random-seed" class="btn" title="Random Seed">
          🎲 Seed
        </button>
      </div>

      <!-- Presets & Curated Seeds -->
      <div class="control-group">
        <label class="control-label">Curated Typographic Preset</label>
        <select id="preset-selector">
          <option value="prague">Prague School of Design (Archetype)</option>
          <option value="zurich">Zurich Kunstgewerbeschule 1958</option>
          <option value="basel">Basel Typografische Monatsblätter</option>
          <option value="bauhaus">Bauhaus Modular Constructivism</option>
        </select>
      </div>

      <!-- Content Configuration -->
      <div class="control-group">
        <label class="control-label">Level 1 Institutional Title</label>
        <input type="text" id="input-title" value="prague school of design" placeholder="institutional title...">
      </div>

      <div class="control-group">
        <label class="control-label">Level 2 Date / Event Range</label>
        <input type="text" id="input-date" value="19—25.06.15" placeholder="e.g. 19—25.06.15">
      </div>

      <div class="control-group">
        <label class="control-label">Level 3 Secondary Metadata</label>
        <input type="text" id="input-meta" value="Prague School of Design" placeholder="micro metadata...">
      </div>

      <!-- Visual Accent Color -->
      <div class="control-group">
        <label class="control-label">Accent Color (&lt; 5% rule)</label>
        <div class="color-swatch-list">
          <div class="color-swatch active" data-color="none" style="background:#000; border: 1px solid #555;" title="Monochrome Only">Ø</div>
          <div class="color-swatch" data-color="#D62828" style="background:#D62828;" title="Signal Red"></div>
          <div class="color-swatch" data-color="#1D4ED8" style="background:#1D4ED8;" title="Ultramarine"></div>
          <div class="color-swatch" data-color="#EA580C" style="background:#EA580C;" title="Safety Orange"></div>
        </div>
      </div>

      <!-- Composition Density & Complexity -->
      <div class="control-group">
        <label class="control-label">Visual Density <span class="val" id="density-val">75%</span></label>
        <input type="range" id="input-density" min="40" max="95" value="75" style="accent-color:#fff;">
      </div>

      <!-- Structural Grid Inspector -->
      <div class="control-group">
        <label class="control-label">Grid &amp; Structural Overlays</label>
        <label class="checkbox-label">
          <input type="checkbox" id="toggle-grid"> 12-Column &times; 18-Row Grid
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="toggle-zones"> Composition Zones (A / B / C)
        </label>
      </div>

      <!-- Stage 04 Rubric Evaluation -->
      <div class="rubric-box">
        <div class="rubric-header">
          <span>STAGE 04: EVALUATION RUBRIC</span>
          <span style="color:#10b981;">PASSED (Score &ge; 8)</span>
        </div>
        <div class="rubric-grid">
          <div class="rubric-item"><span>Grid Compliance</span><span class="score-badge" id="sc-grid">10/10</span></div>
          <div class="rubric-item"><span>Hierarchy Scale</span><span class="score-badge" id="sc-hier">10/10</span></div>
          <div class="rubric-item"><span>Scale Contrast</span><span class="score-badge" id="sc-cont">10/10</span></div>
          <div class="rubric-item"><span>Density Balance</span><span class="score-badge" id="sc-dens">9/10</span></div>
          <div class="rubric-item"><span>Typo-Form Merge</span><span class="score-badge" id="sc-typo">10/10</span></div>
          <div class="rubric-item"><span>Legibility Balance</span><span class="score-badge" id="sc-leg">9/10</span></div>
        </div>
      </div>

      <!-- Export Actions -->
      <div class="control-group">
        <label class="control-label">Vector &amp; High-Res Export</label>
        <div class="button-row">
          <button id="btn-export-svg" class="btn" style="flex:1">Export SVG</button>
          <button id="btn-export-png" class="btn" style="flex:1">Export Hi-Res PNG</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Canvas Workspace -->
  <main class="workspace">
    <div class="toolbar-floating">
      <button class="tool-btn" id="zoom-in">＋ Zoom In</button>
      <button class="tool-btn" id="zoom-out">－ Zoom Out</button>
      <button class="tool-btn" id="zoom-reset">100%</button>
    </div>

    <div class="poster-viewport" id="viewport-frame">
      <!-- 1000 x 1410 Coordinate Space (Standard 100:141 Swiss proportion) -->
      <svg id="poster-svg" viewBox="0 0 1000 1410" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="poster-bounds">
            <rect x="0" y="0" width="1000" height="1410" />
          </clipPath>
        </defs>

        <!-- Base Background -->
        <rect id="svg-bg" width="1000" height="1410" fill="#F4F4F1" />

        <!-- Structural Content Group clipped strictly to poster boundary -->
        <g id="poster-content" clip-path="url(#poster-bounds)"></g>

        <!-- Auxiliary Inspection Layers -->
        <g id="grid-layer" pointer-events="none" opacity="0"></g>
        <g id="zones-layer" pointer-events="none" opacity="0"></g>
      </svg>
    </div>
  </main>
</div>

<script>
/**
 * Experimental Typographic Poster Generator
 * Based on SKILLS.md and HANDOFF.md specifications:
 * - 12 Columns, 18 Rows, 100:141 Ratio
 * - Zones: A (Upper 80%), B (Middle 50%), C (Lower 75%)
 * - Strict Scale: 8, 11, 16, 21, 28, 37, 49, 65, 87, 116, 155, 207, 276
 * - Modular Spacing: 8, 16, 24, 32, 48, 64, 96, 128
 * - Abstract Typographic Deconstruction: rings, semicircles, bars, arcs, micro glyphs
 */

const POSTER_W = 1000;
const POSTER_H = 1410; // 1000 * 1.41
const COLS = 12;
const ROWS = 18;
const MARGIN_X = POSTER_W * 0.06; // 60px
const MARGIN_Y = POSTER_H * 0.06; // 84.6px
const GUTTER = POSTER_W * 0.015;  // 15px

const USABLE_W = POSTER_W - (MARGIN_X * 2);
const COL_W = (USABLE_W - (GUTTER * (COLS - 1))) / COLS;
const USABLE_H = POSTER_H - (MARGIN_Y * 2);
const ROW_H = USABLE_H / ROWS;

let currentSeed = 1915;
let accentColor = 'none';
let currentZoom = 1;

// PRNG for deterministic generative layouts
function PseudoRandom(seed) {
  this.seed = seed % 2147483647;
  if (this.seed <= 0) this.seed += 2147483646;
}
PseudoRandom.prototype.next = function() {
  this.seed = (this.seed * 16807) % 2147483647;
  return (this.seed - 1) / 2147483646;
};
PseudoRandom.prototype.range = function(min, max) {
  return min + this.next() * (max - min);
};
PseudoRandom.prototype.choice = function(arr) {
  return arr[Math.floor(this.next() * arr.length)];
};

function colX(colIndex) {
  return MARGIN_X + colIndex * (COL_W + GUTTER);
}
function rowY(rowIndex) {
  return MARGIN_Y + rowIndex * ROW_H;
}

function generatePoster(seed) {
  const rng = new PseudoRandom(seed);
  const container = document.getElementById('poster-content');
  container.innerHTML = '';

  const titleText = document.getElementById('input-title').value || "prague school of design";
  const dateText = document.getElementById('input-date').value || "19—25.06.15";
  const metaText = document.getElementById('input-meta').value || "Prague School of Design";
  const densityMultiplier = parseInt(document.getElementById('input-density').value) / 100;

  const elements = [];
  const primaryInk = "#000000";
  const activeAccent = accentColor !== 'none' ? accentColor : primaryInk;
  let accentCount = 0;

  const getInk = (prob = 0.1) => {
    if (accentColor !== 'none' && accentCount < 2 && rng.next() < prob) {
      accentCount++;
      return activeAccent;
    }
    return primaryInk;
  };

  // --- 1. ZONE B: CENTRAL ANCHOR (Iconic Ring & Primary Metadata) ---
  const ringCol = 6;
  const ringRow = 8;
  const ringX = colX(ringCol) + COL_W / 2;
  const ringY = rowY(ringRow) + ROW_H / 2;
  const ringOuterR = COL_W * rng.range(2.0, 2.45);
  const ringThickness = COL_W * 0.42;

  elements.push(`
    <!-- Central Anchor Ring -->
    <path d="M ${ringX} ${ringY - ringOuterR}
             A ${ringOuterR} ${ringOuterR} 0 1 0 ${ringX} ${ringY + ringOuterR}
             A ${ringOuterR} ${ringOuterR} 0 1 0 ${ringX} ${ringY - ringOuterR}
             Z
             M ${ringX} ${ringY - (ringOuterR - ringThickness)}
             A ${ringOuterR - ringThickness} ${ringOuterR - ringThickness} 0 1 1 ${ringX} ${ringY + (ringOuterR - ringThickness)}
             A ${ringOuterR - ringThickness} ${ringOuterR - ringThickness} 0 1 1 ${ringX} ${ringY - (ringOuterR - ringThickness)}
             Z"
          fill="${getInk(0.08)}" fill-rule="evenodd" />
  `);

  // Level 2 Typography: Event Date (Left of Ring)
  const dateX = colX(1);
  const dateY = rowY(7) + 24;
  elements.push(`
    <text x="${dateX}" y="${dateY}" 
          font-family="'Inter', sans-serif" 
          font-size="49" 
          font-weight="500" 
          letter-spacing="-1px" 
          fill="${primaryInk}">${dateText}</text>
  `);

  // Secondary Metadata text block (Level 3 / 4)
  const metaX = colX(8) + 12;
  const metaY = rowY(6) + 12;
  const metaParts = metaText.split(' ');
  const m1 = metaParts[0] || 'Prague';
  const m2 = metaParts[1] || 'School';
  const m3 = metaParts.slice(2).join(' ') || 'of Design';

  elements.push(`
    <g transform="translate(${metaX}, ${metaY})">
      <line x1="-12" y1="-8" x2="-4" y2="4" stroke="${primaryInk}" stroke-width="2" />
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.5px" fill="${primaryInk}">${m1}</text>
      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.5px" fill="${primaryInk}">${m2}</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.5px" fill="${primaryInk}">${m3}</text>
      <line x1="86" y1="44" x2="94" y2="56" stroke="${primaryInk}" stroke-width="2" />
    </g>
  `);

  // --- 2. ARCHITECTURAL VERTICAL BARS (Swiss Grid Edge Anchors) ---
  // Left border vertical bars
  elements.push(`
    <rect x="${colX(0)}" y="${rowY(0.4)}" width="${COL_W * 0.7}" height="${ROW_H * 5.2}" fill="${primaryInk}" />
    <rect x="${colX(1)}" y="${rowY(3)}" width="${COL_W * 0.5}" height="${ROW_H * 1.5}" fill="${primaryInk}" />
    <rect x="${colX(0.7)}" y="${rowY(6.5)}" width="${COL_W * 0.5}" height="${ROW_H * 2.8}" fill="${primaryInk}" />
    <rect x="${colX(3.8)}" y="${rowY(8.8)}" width="${COL_W * 0.45}" height="${ROW_H * 4.6}" fill="${primaryInk}" />
  `);

  // Right edge vertical pillars (with controlled cropping)
  elements.push(`
    <rect x="${colX(11) + 8}" y="${rowY(0.2)}" width="${COL_W * 0.6}" height="${ROW_H * 5.8}" fill="${primaryInk}" />
    <rect x="${colX(10)}" y="${rowY(0.8)}" width="${COL_W * 0.4}" height="${ROW_H * 4.2}" fill="${primaryInk}" />
    <rect x="${colX(11.2)}" y="${rowY(6.8)}" width="${COL_W * 0.55}" height="${ROW_H * 4.5}" fill="${primaryInk}" />
    <rect x="${colX(9.5)}" y="${rowY(7.2)}" width="${COL_W * 0.45}" height="${ROW_H * 2.2}" fill="${primaryInk}" />
  `);

  // --- 3. DECONSTRUCTED LETTERFORMS & SEMICIRCLES (Zones A & C) ---
  const semicircles = [
    // Zone A: Upper density field
    { col: 1.5, row: 1.5, r: COL_W * 1.6, thick: COL_W * 0.38, rot: 180 },
    { col: 3.2, row: 2.2, r: COL_W * 1.7, thick: COL_W * 0.38, rot: 0 },
    { col: 2.8, row: 3.5, r: COL_W * 1.8, thick: COL_W * 0.38, rot: 180 },
    { col: 4.4, row: 4.3, r: COL_W * 1.9, thick: COL_W * 0.38, rot: 0 },
    { col: 8.2, row: 1.8, r: COL_W * 1.9, thick: COL_W * 0.38, rot: 180 },
    
    // Zone B/C: Lower field arcs
    { col: 2.2, row: 8.5, r: COL_W * 2.0, thick: COL_W * 0.42, rot: 180 },
    { col: 1.8, row: 10.2, r: COL_W * 2.0, thick: COL_W * 0.42, rot: 0 },
    { col: 1.5, row: 11.5, r: COL_W * 1.8, thick: COL_W * 0.4, rot: 0 },
    { col: 5.6, row: 12.8, r: COL_W * 1.9, thick: COL_W * 0.42, rot: 0 },
    { col: 8.8, row: 10.2, r: COL_W * 2.2, thick: COL_W * 0.45, rot: 180 },
    { col: 9.2, row: 8.2, r: COL_W * 0.8, thick: COL_W * 0.28, rot: 90 }
  ];

  semicircles.forEach((item) => {
    if (rng.next() > densityMultiplier + 0.15) return;
    const cx = colX(item.col);
    const cy = rowY(item.row);
    const outerR = item.r;
    const innerR = outerR - item.thick;
    const color = getInk(0.12);

    elements.push(`
      <path d="M ${-outerR} 0
               A ${outerR} ${outerR} 0 0 1 ${outerR} 0
               L ${innerR} 0
               A ${innerR} ${innerR} 0 0 0 ${-innerR} 0
               Z"
            fill="${color}"
            transform="translate(${cx}, ${cy}) rotate(${item.rot})" />
    `);
  });

  // --- 4. DIAGONAL DYNAMIC TENSION BARS (45° angle) ---
  const diagX = colX(6.8);
  const diagY = rowY(3.8);
  elements.push(`
    <rect x="-14" y="-120" width="${COL_W * 0.4}" height="${ROW_H * 2.8}" fill="${primaryInk}"
          transform="translate(${diagX}, ${diagY}) rotate(45)" />
    <rect x="-10" y="-40" width="${COL_W * 0.35}" height="${ROW_H * 0.9}" fill="${primaryInk}"
          transform="translate(${colX(8.8)}, ${rowY(6.8)}) rotate(-90)" />
  `);

  // --- 5. MICRO TYPOGRAPHIC GLYPH CLUSTERS (Deconstructed Font Matrix) ---
  const glyphClusters = [
    { x: colX(7.5), y: rowY(2.2), scale: 0.9 },
    { x: colX(1.7), y: rowY(6.6), scale: 0.75 },
    { x: colX(4.8), y: rowY(9.8), scale: 1.1 }
  ];

  glyphClusters.forEach((cl) => {
    let glyphs = ``;
    const numGlyphs = Math.floor(rng.range(9, 16));
    for (let i = 0; i < numGlyphs; i++) {
      const gx = rng.range(0, 100);
      const gy = rng.range(0, 75);
      const gType = Math.floor(rng.range(0, 4));
      const gColor = primaryInk;

      if (gType === 0) {
        glyphs += `<path d="M -9 0 A 9 9 0 0 1 9 0" stroke="${gColor}" stroke-width="3" fill="none" transform="translate(${gx}, ${gy}) rotate(${rng.choice([0, 90, 180, 270])})" />`;
      } else if (gType === 1) {
        glyphs += `<line x1="0" y1="0" x2="${rng.choice([16, 28, 42])}" y2="0" stroke="${gColor}" stroke-width="${rng.choice([2.5, 4])}" transform="translate(${gx}, ${gy}) rotate(${rng.choice([0, 90])})" />`;
      } else if (gType === 2) {
        glyphs += `<path d="M 0 0 L 10 0 L 10 10" stroke="${gColor}" stroke-width="2.5" fill="none" transform="translate(${gx}, ${gy})" />`;
      } else {
        glyphs += `<rect x="${gx}" y="${gy}" width="4" height="4" fill="${gColor}" />`;
      }
    }

    elements.push(`
      <g transform="translate(${cl.x}, ${cl.y}) scale(${cl.scale})">
        ${glyphs}
      </g>
    `);
  });

  // --- 6. ZONE C RESOLUTION: PRIMARY INSTITUTIONAL TITLE (Level 1) ---
  const titleParts = titleText.split(" ");
  const line1 = titleParts[0] || "prague";
  const line2 = titleParts[1] || "school";
  const line3 = titleParts.slice(2).join(" ") || "of design";
  
  const titleX = colX(7.6);
  const titleY = rowY(11.4);
  const fontSize = 65; 
  const lineLeading = 58;

  elements.push(`
    <g transform="translate(${titleX}, ${titleY})">
      <text x="0" y="0" 
            font-family="'Inter', sans-serif" 
            font-size="${fontSize}" 
            font-weight="700" 
            letter-spacing="-2.5px" 
            fill="${primaryInk}">${line1}</text>
      <text x="0" y="${lineLeading}" 
            font-family="'Inter', sans-serif" 
            font-size="${fontSize}" 
            font-weight="700" 
            letter-spacing="-2.5px" 
            fill="${primaryInk}">${line2}</text>
      <text x="0" y="${lineLeading * 2}" 
            font-family="'Inter', sans-serif" 
            font-size="${fontSize}" 
            font-weight="700" 
            letter-spacing="-2.5px" 
            fill="${primaryInk}">${line3}</text>
    </g>
  `);

  // Structural horizontal footing bars (Zone C anchor)
  elements.push(`
    <rect x="${colX(1)}" y="${rowY(12.7)}" width="${COL_W * 1.8}" height="${ROW_H * 0.4}" fill="${primaryInk}" />
    <rect x="${colX(7.6)}" y="${rowY(13.2)}" width="${COL_W * 3.3}" height="${ROW_H * 0.45}" fill="${primaryInk}" />
  `);

  container.innerHTML = elements.join('\n');
}

function renderGridOverlay() {
  const gridGroup = document.getElementById('grid-layer');
  gridGroup.innerHTML = '';
  
  let markup = '';
  for (let c = 0; c < COLS; c++) {
    const x = colX(c);
    markup += `<rect x="${x}" y="${MARGIN_Y}" width="${COL_W}" height="${USABLE_H}" fill="rgba(0, 120, 255, 0.05)" stroke="rgba(0, 120, 255, 0.25)" stroke-width="1" />`;
  }
  for (let r = 0; r <= ROWS; r++) {
    const y = rowY(r);
    markup += `<line x1="${MARGIN_X}" y1="${y}" x2="${POSTER_W - MARGIN_X}" y2="${y}" stroke="rgba(255, 0, 80, 0.2)" stroke-width="1" stroke-dasharray="3 3" />`;
  }
  markup += `<rect x="${MARGIN_X}" y="${MARGIN_Y}" width="${USABLE_W}" height="${USABLE_H}" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" />`;
  gridGroup.innerHTML = markup;
}

function renderZonesOverlay() {
  const zoneGroup = document.getElementById('zones-layer');
  zoneGroup.innerHTML = '';
  
  const hA = POSTER_H * 0.38;
  const hB = POSTER_H * 0.28;
  const hC = POSTER_H - hA - hB;

  const markup = `
    <!-- Zone A -->
    <rect x="0" y="0" width="${POSTER_W}" height="${hA}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6" />
    <text x="30" y="50" font-family="'Inter'" font-size="20" font-weight="700" fill="#2563eb">ZONE A (UPPER DENSITY ~80%)</text>
    <!-- Zone B -->
    <rect x="0" y="${hA}" width="${POSTER_W}" height="${hB}" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 6" />
    <text x="30" y="${hA + 50}" font-family="'Inter'" font-size="20" font-weight="700" fill="#16a34a">ZONE B (PAUSE & ANCHOR ~50%)</text>
    <!-- Zone C -->
    <rect x="0" y="${hA + hB}" width="${POSTER_W}" height="${hC}" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 6" />
    <text x="30" y="${hA + hB + 50}" font-family="'Inter'" font-size="20" font-weight="700" fill="#d97706">ZONE C (RESOLUTION ~75%)</text>
  `;
  zoneGroup.innerHTML = markup;
}

// Event Listeners
document.getElementById('btn-generate').addEventListener('click', () => {
  currentSeed = Math.floor(Math.random() * 999999);
  generatePoster(currentSeed);
});

document.getElementById('btn-random-seed').addEventListener('click', () => {
  currentSeed = Math.floor(Math.random() * 999999);
  generatePoster(currentSeed);
});

document.getElementById('preset-selector').addEventListener('change', (e) => {
  const val = e.target.value;
  if (val === 'prague') {
    currentSeed = 1915;
    document.getElementById('input-title').value = "prague school of design";
    document.getElementById('input-date').value = "19—25.06.15";
    document.getElementById('input-meta').value = "Prague School of Design";
  } else if (val === 'zurich') {
    currentSeed = 4058;
    document.getElementById('input-title').value = "kunstgewerbe museum zurich";
    document.getElementById('input-date').value = "04—28.11.58";
    document.getElementById('input-meta').value = "Konstruktive Grafik";
  } else if (val === 'basel') {
    currentSeed = 7712;
    document.getElementById('input-title').value = "allgemeine gewerbeschule";
    document.getElementById('input-date').value = "12—19.04.68";
    document.getElementById('input-meta').value = "Typografische Monatsblatter";
  } else if (val === 'bauhaus') {
    currentSeed = 8841;
    document.getElementById('input-title').value = "staatliches bauhaus weimar";
    document.getElementById('input-date').value = "15—22.08.23";
    document.getElementById('input-meta').value = "Ausstellung Konstruktivismus";
  }
  generatePoster(currentSeed);
});

['input-title', 'input-date', 'input-meta'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => generatePoster(currentSeed));
});

const densityInput = document.getElementById('input-density');
densityInput.addEventListener('input', (e) => {
  document.getElementById('density-val').textContent = e.target.value + '%';
  generatePoster(currentSeed);
});

document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    accentColor = swatch.getAttribute('data-color');
    generatePoster(currentSeed);
  });

document.getElementById('toggle-grid').addEventListener('change', (e) => {
  document.getElementById('grid-layer').setAttribute('opacity', e.target.checked ? '1' : '0');
});

document.getElementById('toggle-zones').addEventListener('change', (e) => {
  document.getElementById('zones-layer').setAttribute('opacity', e.target.checked ? '1' : '0');
});

const viewportFrame = document.getElementById('viewport-frame');
document.getElementById('zoom-in').addEventListener('click', () => {
  currentZoom = Math.min(currentZoom + 0.15, 2.0);
  viewportFrame.style.transform = `scale(${currentZoom})`;
});
document.getElementById('zoom-out').addEventListener('click', () => {
  currentZoom = Math.max(currentZoom - 0.15, 0.5);
  viewportFrame.style.transform = `scale(${currentZoom})`;
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  currentZoom = 1;
  viewportFrame.style.transform = `scale(1)`;
});

document.getElementById('btn-export-svg').addEventListener('click', () => {
  const svgEl = document.getElementById('poster-svg').cloneNode(true);
  if (document.getElementById('grid-layer').getAttribute('opacity') === '0') {
    svgEl.querySelector('#grid-layer').remove();
  }
  if (document.getElementById('zones-layer').getAttribute('opacity') === '0') {
    svgEl.querySelector('#zones-layer').remove();
  }
  const serializer = new XMLSerializer();
  const source = '<?xml version="1.0" standalone="no"?>\r\n' + serializer.serializeToString(svgEl);
  const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `swiss-poster-${currentSeed}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

document.getElementById('btn-export-png').addEventListener('click', () => {
  const svgEl = document.getElementById('poster-svg');
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svgEl);
  const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const URLObj = window.URL || window.webkitURL || window;
  const blobURL = URLObj.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = POSTER_W * 2;
    canvas.height = POSTER_H * 2;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URLObj.revokeObjectURL(blobURL);

    const pngUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl;
    a.download = `swiss-poster-${currentSeed}-2x.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  img.src = blobURL;
});

// Initialize
renderGridOverlay();
renderZonesOverlay();
generatePoster(currentSeed);
</script>
