<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commute Sequence</title><style>body{margin:0;background:#fff;color:#111;font-family:Georgia,'Times New Roman',serif}header{border-bottom:1px solid #ddd;padding:28px 0 18px;text-align:center}h1{margin:0;font-size:54px;font-weight:400;letter-spacing:.5px}main{max-width:1100px;margin:40px auto;padding:0 24px}.kicker{text-transform:uppercase;letter-spacing:2px;font-size:12px;text-align:center;margin-bottom:28px;color:#666}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px}.item img{width:100%;display:block}.caption{margin-top:12px;font-size:22px;line-height:1.3}.number{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#666;display:block;margin-bottom:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><header><h1>Commute</h1></header><main><div class="kicker">Image Generation Sequence</div><div class="grid"><div class="item"><img src="commute1.jpg"><div class="caption"><span class="number">Generation 1</span>Commute 1</div></div><div class="item"><img src="commute2.jpg"><div class="caption"><span class="number">Generation 2</span>Commute 2</div></div><div class="item"><img src="commute3.jpg"><div class="caption"><span class="number">Generation 3</span>Commute 3</div></div><div class="item"><img src="commute4.jpg"><div class="caption"><span class="number">Generation 4</span>Commute 4</div></div></div></main></body></html>
