<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commute Sequence</title>
<style>
body{margin:0;padding:40px;background:#f5f5f5;font-family:Arial,sans-serif}
h1{text-align:center;font-weight:400;margin-bottom:30px}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card img{width:100%;display:block}
.caption{text-align:center;padding:12px;color:#666}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Commute Image Sequence</h1>
<div class="grid">
<div class="card"><img src="commute1.png" alt="Commute 1"><div class="caption">Commute 1</div></div>
<div class="card"><img src="commute2.png" alt="Commute 2"><div class="caption">Commute 2</div></div>
<div class="card"><img src="commute3.png" alt="Commute 3"><div class="caption">Commute 3</div></div>
<div class="card"><img src="commute4.png" alt="Commute 4"><div class="caption">Commute 4</div></div>
</div>
</body>
</html>
