<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Clock</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#fff;margin:0;padding:40px 20px;text-align:center;overflow-x:hidden}.stars,.stars:before,.stars:after{position:fixed;inset:0;width:200%;pointer-events:none}.stars{background-image:radial-gradient(#f8bfd7 1.5px,transparent 1.5px),radial-gradient(#bfe8ff 1.5px,transparent 1.5px);background-size:140px 140px,180px 180px;animation:drift 40s linear infinite;opacity:.7}.stars:before,.stars:after{content:''}.stars:before{background-image:radial-gradient(#ffd6e7 1px,transparent 1px);background-size:160px 160px;animation:drift 55s linear infinite}.stars:after{background-image:radial-gradient(#d6f0ff 1px,transparent 1px);background-size:200px 200px;animation:drift 70s linear infinite reverse}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}.container{position:relative;z-index:1}h1{font-size:3rem;font-weight:300;margin:0}.date{font-size:1.75rem;font-weight:300;margin:10px 0 36px;text-transform:uppercase}.controls{margin-bottom:28px}.controls select{padding:10px;font-family:Inter;border:1px solid #000;outline:none}.clocks{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:16px;margin-top:48px}.clock{position:relative;width:165px;height:120px;border:1px solid #000;border-radius:10px;background:#fff;padding:10px 0 10px 22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.remove{position:absolute;right:8px;top:4px;background:none;border:none;color:#000;cursor:pointer}.city,.time{text-align:left;width:100%;font-weight:300}.city{font-size:1rem}.time{font-size:1.4rem}@media(max-width:700px){.clocks{grid-template-columns:repeat(2,auto)}}</style></head><body><div class="stars"></div><div class="container"><h1>World Clock</h1><div id="current-date" class="date"></div><div class="controls"><select id="citySelect"><option value="">Add a city...</option></select></div><div id="clocks" class="clocks"></div></div><script>const allCities=[{city:'New York',tz:'America/New_York'},{city:'London',tz:'Europe/London'},{city:'Tokyo',tz:'Asia/Tokyo'},{city:'Korea',tz:'Asia/Seoul'},{city:'Dubai',tz:'Asia/Dubai'},{city:'Paris',tz:'Europe/Paris'},{city:'New Delhi',tz:'Asia/Kolkata'},{city:'Stockholm',tz:'Europe/Stockholm'},{city:'Amsterdam',tz:'Europe/Amsterdam'},{city:'Copenhagen',tz:'Europe/Copenhagen'},{city:'Zurich',tz:'Europe/Zurich'},{city:'Helsinki',tz:'Europe/Helsinki'},{city:'Dublin',tz:'Europe/Dublin'},{city:'Lisbon',tz:'Europe/Lisbon'},{city:'Athens',tz:'Europe/Athens'},{city:'Prague',tz:'Europe/Prague'},{city:'Vienna',tz:'Europe/Vienna'}];let active=allCities.slice(0,6);const maxCities=9;function emoji(h){return h>=6&&h<18?'☀️':'🌙'}function render(){const wrap=document.getElementById('clocks');wrap.innerHTML='';active.forEach((c,i)=>{const d=document.createElement('div');d.className='clock';d.innerHTML='<button class="remove" onclick="removeCity('+i+')">×</button><div class="city" id="city'+i+'"></div><div class="time" id="time'+i+'"></div>';wrap.appendChild(d);});updateTimes();updateDropdown();}function removeCity(i){active.splice(i,1);render()}function updateDropdown(){const s=document.getElementById('citySelect');s.innerHTML='<option value="">Add a city...</option>';allCities.filter(c=>!active.some(a=>a.city===c.city)).forEach(c=>{const o=document.createElement('option');o.value=c.city;o.textContent=c.city;s.appendChild(o);});}document.getElementById('citySelect').onchange=function(){if(!this.value||active.length>=maxCities)return;active.push(allCities.find(c=>c.city===this.value));this.value='';render();};function updateTimes(){const now=new Date();document.getElementById('current-date').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now).toUpperCase();active.forEach((c,i)=>{const time=new Intl.DateTimeFormat('en-US',{timeZone:c.tz,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(now);const hr=Number(new Intl.DateTimeFormat('en-US',{timeZone:c.tz,hour:'numeric',hour12:false}).format(now));const cityEl=document.getElementById('city'+i);const timeEl=document.getElementById('time'+i);if(cityEl){cityEl.textContent=emoji(hr)+' '+c.city;timeEl.textContent=time;}});}render();setInterval(updateTimes,1000);</script></body></html>
